# 이 파일에는 실제 키를 입력하지 않은 상태로 ZIP에 포함합니다.
# 최초 1회 아래 위치로 복사하고 파일명을 payment.properties로 변경하세요.
# C:/Users/본인윈도우계정/feedflow-config/payment.properties

# PortOne V1 고객사 식별코드
feedflow.payment.portone.customer-code=

# PortOne REST API 인증 정보 - 브라우저나 채팅에 공개하지 마세요.
feedflow.payment.portone.api-key=
feedflow.payment.portone.api-secret=

# PortOne 콘솔에서 발급한 결제 채널 키
feedflow.payment.portone.card-channel-key=
feedflow.payment.portone.kakao-channel-key=
feedflow.payment.portone.virtual-account-channel-key=

# 선택 사항: 관리자 계정도 Import 후 유지하려면 입력합니다.
feedflow.admin.username=admin
feedflow.admin.password=

# 로컬 시연에서는 true: 비밀번호 재설정 인증번호가 STS Console에도 출력됩니다.
feedflow.security.password-recovery.console-enabled=true
