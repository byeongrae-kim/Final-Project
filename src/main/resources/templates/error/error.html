<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>요청 처리 안내 | FEED FLOW</title>
    <link rel="icon" type="image/png" th:href="@{/images/feedflow-logo.png}" href="/images/feedflow-logo.png">
    <link rel="stylesheet" th:href="@{/css/error.css}" href="/css/error.css">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <a class="error-brand" href="/"><img th:src="@{/images/feedflow-logo.png}" src="/images/feedflow-logo.png" alt="FEED FLOW"></a>
        <p class="error-code" th:text="|ERROR ${status ?: ''}|">ERROR</p>
        <h1>요청을 완료하지<br>못했습니다.</h1>
        <p class="error-description">입력 내용과 주문 상태를 확인한 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의해 주세요.</p>
        <div class="error-actions"><a href="/">메인으로 돌아가기</a><a href="javascript:history.back()">이전 화면</a></div>
        <p class="error-reference">FEED FLOW 안전 오류 안내</p>
    </section>
</main>
</body>
</html>
