<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | FEED FLOW</title>
    <link rel="icon" type="image/png" th:href="@{/images/feedflow-logo.png}" href="/images/feedflow-logo.png">
    <link rel="stylesheet" th:href="@{/css/error.css}" href="/css/error.css">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <a class="error-brand" href="/"><img th:src="@{/images/feedflow-logo.png}" src="/images/feedflow-logo.png" alt="FEED FLOW"></a>
        <p class="error-code">ERROR 404</p>
        <h1>요청한 페이지를<br>찾을 수 없습니다.</h1>
        <p class="error-description">주소가 변경되었거나 삭제된 페이지입니다. 주소를 다시 확인하거나 상품 구매 화면으로 돌아가 주세요.</p>
        <div class="error-actions"><a href="/">메인으로 돌아가기</a><a href="javascript:history.back()">이전 화면</a></div>
        <p class="error-reference">FEED FLOW · Reliable Feed, Transparent Distribution</p>
    </section>
</main>
</body>
</html>
