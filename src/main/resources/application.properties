spring.application.name=finalProject
server.port=8080
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# 프로젝트를 다시 Import해도 유지되는 외부 비밀 설정 파일입니다.
# 파일이 없어도 실행되며, STS 환경변수가 있으면 환경변수가 더 우선합니다.
spring.config.import=optional:file:${user.home}/feedflow-config/payment.properties

# H2 Database (애플리케이션을 실행하면 자동 생성됩니다.)
spring.datasource.url=jdbc:h2:file:./data/feedflow;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.defer-datasource-initialization=true

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# Thymeleaf (개발 중 HTML 저장 시 즉시 반영)
spring.thymeleaf.cache=false

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload.path=D:/dev/upload/

# 오류 응답에 내부 예외·스택트레이스를 노출하지 않습니다.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# 로컬 시연용 인증번호는 STS Console에만 출력합니다.
# 운영 배포 전 false로 변경하고 이메일/SMS 발송 구현체를 연결하세요.
feedflow.security.password-recovery.console-enabled=${FEEDFLOW_RECOVERY_CONSOLE_ENABLED:true}

# 관리자 API 계정은 환경변수로만 주입합니다.
feedflow.admin.username=${FEEDFLOW_ADMIN_USERNAME:}
feedflow.admin.password=${FEEDFLOW_ADMIN_PASSWORD:}

# PortOne V1 통합 결제
# 고객사 식별코드와 채널 키는 결제창에서 사용되며, API Key/Secret은 서버에서만 사용합니다.
feedflow.payment.portone.customer-code=${PORTONE_CUSTOMER_CODE:}
feedflow.payment.portone.api-key=${PORTONE_API_KEY:}
feedflow.payment.portone.api-secret=${PORTONE_API_SECRET:}
feedflow.payment.portone.card-channel-key=${PORTONE_CARD_CHANNEL_KEY:}
feedflow.payment.portone.kakao-channel-key=${PORTONE_KAKAO_CHANNEL_KEY:}
feedflow.payment.portone.virtual-account-channel-key=${PORTONE_VBANK_CHANNEL_KEY:}
