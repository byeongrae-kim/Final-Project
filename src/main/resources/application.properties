spring.application.name=finalProject
server.port=8080
# 스프링 시큐리티 기본 UserDetailsService 자동 설정 제외
# (직접 구현한 UserDetailsService 를 사용하기 위해)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ─────────────────────────────────────────────
# H2 파일 데이터베이스
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/finalproject;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 외부에서 H2 콘솔 접근 차단
spring.h2.console.settings.web-allow-others=false

# H2 방언
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL RDS로 다시 전환할 때만 아래 설정을 활성화합니다.
# spring.datasource.url=jdbc:mysql://DB_HOST:3306/DB_NAME
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${MYSQL_USERNAME:}
# spring.datasource.password=${MYSQL_PASSWORD:}
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────
# JPA
# ─────────────────────────────────────────────
# update : 변경된 부분만 반영 (기존 데이터 유지!)
spring.jpa.hibernate.ddl-auto=update
# open-in-view : 뷰 렌더링 중 DB 연결 유지 여부 (false 권장!)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# default_batch_fetch_size : 연관 엔티티 조회 시 한 번에 가져올 개수 (N+1 문제 완화)
spring.jpa.properties.hibernate.default_batch_fetch_size=100


# ─────────────────────────────────────────────
# 세션 설정
# ─────────────────────────────────────────────
# 세션 쿠키는 브라우저를 종료하면 사라지고, 같은 브라우저 세션 안에서는 유지됩니다.
server.servlet.session.timeout=30d
# http-only : 자바스크립트에서 쿠키 접근 불가 (XSS 공격 방지)
server.servlet.session.cookie.http-only=true
# same-site : 동일 사이트 요청에만 쿠키 전송 (CSRF 공격 방지)
server.servlet.session.cookie.same-site=lax


# ─────────────────────────────────────────────
# Jackson (JSON 직렬화 설정)
# ─────────────────────────────────────────────
# 날짜를 타임스탬프(숫자) 대신 문자열로 직렬화
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul


# ─────────────────────────────────────────────
# Thymeleaf
# ─────────────────────────────────────────────
# cache=false : 개발 중 템플릿 수정 즉시 반영 (운영 시 true 권장!)
spring.thymeleaf.cache=false


# ─────────────────────────────────────────────
# Form method support
# ─────────────────────────────────────────────
# PUT / DELETE 방식 폼 전송 허용 (_method 히든 필드 사용)
spring.mvc.hiddenmethod.filter.enabled=true


# ─────────────────────────────────────────────
# 파일 업로드
# ─────────────────────────────────────────────
# max-file-size    : 파일 1개당 최대 크기
# max-request-size : 요청 전체 최대 크기 (파일 여러 개 업로드 시 전체 합계)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
feedflow.upload.product-image-dir=${PRODUCT_IMAGE_UPLOAD_DIR:uploads/product-images}
file.upload.path=D:/dev/upload/

server.error.include-message=always


# ─────────────────────────────────────────────
# Kakao Maps
# ─────────────────────────────────────────────
kakao.maps.javascript-key=${KAKAO_MAP_JAVASCRIPT_KEY:}


# ─────────────────────────────────────────────
# 관리자 / 스태프 계정 설정
# ─────────────────────────────────────────────
# 이 프로젝트 시연용 기본 관리자 계정입니다.
# 배포 환경에서는 FEEDFLOW_ADMIN_USERNAME/PASSWORD 환경변수로 반드시 덮어쓰세요!
feedflow.admin.username=${FEEDFLOW_ADMIN_USERNAME:admin}
feedflow.admin.password=${FEEDFLOW_ADMIN_PASSWORD:}
feedflow.admin.name=${FEEDFLOW_ADMIN_NAME:김책임}
feedflow.staff.username=${FEEDFLOW_STAFF_USERNAME:staff@feedflow.co.kr}
feedflow.staff.password=${FEEDFLOW_STAFF_PASSWORD:}
feedflow.staff.name=${FEEDFLOW_STAFF_NAME:김사원}
feedflow.security.remember-me-key=${FEEDFLOW_REMEMBER_ME_KEY:feedflow-local-remember-me-key-change-in-production}


# ─────────────────────────────────────────────
# 비밀번호 찾기 인증번호 정책
# ─────────────────────────────────────────────
# code-ttl           : 인증번호 유효 시간
# resend-cooldown    : 재전송 대기 시간
# max-attempts       : 최대 시도 횟수
feedflow.password-reset.code-ttl=${FEEDFLOW_PASSWORD_RESET_CODE_TTL:5m}
feedflow.password-reset.resend-cooldown=${FEEDFLOW_PASSWORD_RESET_RESEND_COOLDOWN:30s}
feedflow.password-reset.max-attempts=${FEEDFLOW_PASSWORD_RESET_MAX_ATTEMPTS:5}
# expose-code : 외부 문자/메일 연동 전, 로컬 테스트에서만 true 로 설정하면 응답에 코드가 포함됩니다.
feedflow.password-reset.expose-code=${FEEDFLOW_PASSWORD_RESET_EXPOSE_CODE:false}

# ─────────────────────────────────────────────
# 메일 설정 (SMTP)
# ─────────────────────────────────────────────
spring.mail.host=${FEEDFLOW_SMTP_HOST:}
spring.mail.port=${FEEDFLOW_SMTP_PORT:587}
spring.mail.username=${FEEDFLOW_SMTP_USERNAME:}
spring.mail.password=${FEEDFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${FEEDFLOW_SMTP_AUTH:true}

# ─────────────────────────────────────────────
# SMS 설정 (Naver SENS)
# ─────────────────────────────────────────────
spring.mail.properties.mail.smtp.starttls.enable=${FEEDFLOW_SMTP_STARTTLS:true}
feedflow.password-reset.sms-enabled=${FEEDFLOW_RECOVERY_SMS_ENABLED:false}
feedflow.sms.naver.service-id=${NAVER_SENS_SERVICE_ID:}
feedflow.sms.naver.access-key=${NAVER_CLOUD_ACCESS_KEY:}
feedflow.sms.naver.secret-key=${NAVER_CLOUD_SECRET_KEY:}
feedflow.sms.naver.sender-phone=${NAVER_SENS_SENDER_PHONE:}
feedflow.password-reset.mail.from=${FEEDFLOW_PASSWORD_RESET_MAIL_FROM:${FEEDFLOW_SMTP_USERNAME:}}


# ─────────────────────────────────────────────
# 농장 이용 알림 설정
# ─────────────────────────────────────────────
# 화면 알림은 항상 제공되며, scheduled-enabled 가 true 이면 SMTP/SENS 로 매일 발송합니다.
feedflow.notifications.scheduled-enabled=${FEEDFLOW_NOTIFICATIONS_ENABLED:true}
feedflow.notifications.cron=${FEEDFLOW_NOTIFICATIONS_CRON:0 0 9 * * *}


# ─────────────────────────────────────────────
# PortOne V1 결제 설정
# ─────────────────────────────────────────────
# 모두 비어 있으면 기존 레거시 즉시 주문 모드로 동작합니다.
feedflow.payment.portone.customer-code=${PORTONE_CUSTOMER_CODE:}
feedflow.payment.portone.api-key=${PORTONE_API_KEY:}
feedflow.payment.portone.api-secret=${PORTONE_API_SECRET:}
feedflow.payment.portone.card-channel-key=${PORTONE_CARD_CHANNEL_KEY:}
feedflow.payment.portone.kakao-channel-key=${PORTONE_KAKAO_CHANNEL_KEY:}
feedflow.payment.portone.virtual-account-channel-key=${PORTONE_VBANK_CHANNEL_KEY:}
# 카드·간편결제는 결제창을 이탈하면 짧게 정리합니다.
feedflow.payment.pending-timeout-minutes=${PAYMENT_PENDING_TIMEOUT_MINUTES:15}
# 무통장 입금은 고객이 실제로 입금을 완료할 시간이 필요해 기본 3일로 설정됩니다.
feedflow.payment.deposit-timeout-minutes=${PAYMENT_DEPOSIT_TIMEOUT_MINUTES:4320}
feedflow.payment.pending-cleanup-ms=${PAYMENT_PENDING_CLEANUP_MS:60000}


# ─────────────────────────────────────────────
# 데모 설정
# ─────────────────────────────────────────────
# 데모용 가상 농장 최근 6개월 출고·입고 이력입니다.
# 실제 이용 환경에서는 FEEDFLOW_DEMO_FARM_DELIVERIES_ENABLED=false 로 끄세요.
feedflow.demo.farm-deliveries-enabled=${FEEDFLOW_DEMO_FARM_DELIVERIES_ENABLED:true}
feedflow.demo.defects-enabled=${FEEDFLOW_DEMO_DEFECTS_ENABLED:true}


# ─────────────────────────────────────────────
# DeliveryAPI 배송 조회
# ─────────────────────────────────────────────
# api-key 가 비어 있으면 외부 조회 비활성화!
feedflow.delivery-api.base-url=${DELIVERY_API_BASE_URL:https://api.deliveryapi.co.kr}
feedflow.delivery-api.api-key=${DELIVERY_API_KEY:}
feedflow.delivery-api.secret-key=${DELIVERY_API_SECRET:}
