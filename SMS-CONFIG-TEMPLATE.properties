# 실제 SMS가 필요할 때만 이 템플릿을 복사해 사용합니다.
# C:/Users/본인윈도우계정/feedflow-config/sms.properties
# 실제 키를 ZIP, Git, 메신저, 채팅에 올리지 마세요.

# false이면 가입이나 비용 없이 STS Console에서만 인증번호를 확인합니다.
feedflow.security.password-recovery.sms-enabled=false
feedflow.security.password-recovery.console-enabled=true

# Naver Cloud SENS를 이용해 실제 문자를 보낼 때 아래 값을 채우고
# sms-enabled를 true로 변경합니다.
feedflow.sms.naver.service-id=
feedflow.sms.naver.access-key=
feedflow.sms.naver.secret-key=

# Naver Cloud SENS 콘솔에서 사전 등록한 발신번호만 사용할 수 있습니다.
feedflow.sms.naver.sender-phone=
